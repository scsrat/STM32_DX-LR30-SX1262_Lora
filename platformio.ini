; Projeto: Repeater LoRa "compatível com Meshtastic" para STM32F103 + SX1262 (DX-LR30)
;
; IMPORTANTE: isto NAO e o firmware oficial do Meshtastic (que nao roda em STM32F103
; por falta de flash/RAM). E um firmware proprio que fala o mesmo protocolo de radio
; e sabe decrementar o hop_limit e retransmitir pacotes no nivel fisico, sem decifrar
; o conteudo. Ele funciona como um "repetidor burro" de camada de radio.

[env:bluepill_f103c8]
platform = ststm32
board = bluepill_f103c8        ; CONFIRMADO via mcuisp: chip genuino de 64KB de flash
                                ; (nao e um clone de 128KB). Se um dia trocar de placa
                                ; e o mcuisp mostrar "FLASH ROM size:128KB", ai sim use
                                ; bluepill_f103c8_128k.
framework = arduino

; Caminho mais confiavel de flash: ST-Link (SWD) ou adaptador serial-TTL usando
; o bootloader de fabrica da ST (pino BOOT0 em 1). Ver README.md.
upload_protocol = stlink
;upload_protocol = serial
;upload_port = COM6
;upload_speed = 115200

monitor_speed = 115200
monitor_port = COM6

lib_deps =
    jgromes/RadioLib@^7.1.2

extra_scripts = post:scripts/create_hex.py